@if (notification) {
  <div class="notification-banner" [class]="'banner-' + notification.type">
    <mat-icon class="banner-icon" aria-hidden="true">{{ icon }}</mat-icon>
    <span class="banner-text">{{ notification.message }}</span>
    @if (notification.secondaryAction; as action) {
      <button mat-stroked-button type="button" [disabled]="action.disabled?.() ?? false" (click)="action.callback()">
        <mat-icon aria-hidden="true">undo</mat-icon>
        {{ action.label }}
      </button>
    }
    @if (notification.action) {
      <button mat-flat-button type="button" [color]="actionColor" [disabled]="notification.action.disabled?.() ?? false" (click)="onAction()">
        <mat-icon aria-hidden="true">refresh</mat-icon>
        {{ notification.action.label }}
      </button>
    }
    @if (notification.dismissible) {
      <button mat-icon-button class="banner-dismiss" (click)="dismiss()"
        aria-label="关闭通知" matTooltip="关闭通知" matTooltipShowDelay="500">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
}
