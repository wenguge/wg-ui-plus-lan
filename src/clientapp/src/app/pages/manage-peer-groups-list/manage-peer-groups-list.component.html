<div class="list-toolbar">
  <span class="list-hint">添加、编辑或删除节点分组</span>
  <button mat-flat-button color="primary" type="button" (click)="newItem();">
    <mat-icon>add</mat-icon>
    新建
  </button>
</div>
<div class="table-scroll">
<table class="data-table" matSort matSortDisableClear matSortActive="name" matSortDirection="asc" (matSortChange)="sortData($event)">
  <thead>
    <tr>
      <th mat-sort-header="name" sortActionDescription="按名称排序">名称</th>
      <th>描述</th>
      <th>状态</th>
      <th>可访问目标</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    @for (peerGroup of peerGroups; track peerGroup.id) {
      <tr>
        <td>{{ peerGroup.name }}</td>
        <td>{{ peerGroup.description }}</td>
        <td>
          @if (peerGroup.disabled) {
            <span class="status-chip status-chip-off">已禁用</span>
          } @else {
            <span class="status-chip status-chip-ok">已启用</span>
          }
        </td>
        <td>{{ peerGroup.target_names }}</td>
        <td>
          <button mat-stroked-button type="button" (click)="editItem(peerGroup);">
            <mat-icon>edit</mat-icon>
            编辑
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="empty-row">暂无节点分组。</td>
      </tr>
    }
  </tbody>
</table>
</div>
