<app-page-header title="VPN 拓扑"
  subtitle="查看访问目标、节点分组和节点的关联。每 {{refreshDelay}} 秒刷新。">
</app-page-header>

<mat-card>
  <mat-card-content>
    <app-org-chart [value]="hierarchyData"></app-org-chart>
    <div class="layout-notes">
      <ul>
        <li>节点是接入 VPN 的设备。</li>
        <li>访问目标可以是单个 IP、主机上的指定端口或整个网段。</li>
        <li>
          节点分组用于给一组设备授予访问目标的权限。
          <ul>
            <li>可以在分组或访问目标的编辑页建立关联。</li>
            <li>建立关联后，添加或移出组内节点即可授予或撤销对应权限。</li>
          </ul>
        </li>
      </ul>
    </div>
  </mat-card-content>
</mat-card>
