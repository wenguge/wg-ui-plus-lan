<div class="editor-form form-grid">
  <mat-form-field class="form-span">
    <mat-label>名称</mat-label>
    <input matInput id="targetName" [(ngModel)]="editItem.name" [disabled]="!editItem.allow_modify_self"
      matTooltip="VPN 允许访问的主机或网段。" matTooltipPosition="above" matTooltipShowDelay="500"
      autofocus />
  </mat-form-field>
  <mat-form-field class="form-span">
    <mat-label>描述</mat-label>
    <input matInput id="targetDescription" [(ngModel)]="editItem.description"
      [disabled]="!editItem.allow_modify_self" matTooltip="用于说明访问目标的描述。" matTooltipPosition="above" matTooltipShowDelay="500" />
  </mat-form-field>
  <app-validation-errors-display class="form-span" field="name" [validationResult]="validationResult">
  </app-validation-errors-display>
  <app-validation-errors-display class="form-span" field="description" [validationResult]="validationResult">
  </app-validation-errors-display>
  <mat-form-field class="form-span">
    <mat-label>IP 地址或网段</mat-label>
    <input matInput id="targetIPAddress" [(ngModel)]="editItem.ip_address"
      [disabled]="!editItem.allow_modify_self"
      [matTooltip]="addressInput.tooltip" matTooltipShowDelay="500"
      matTooltipPosition="above" />
    <mat-hint>{{ addressInput.example }}</mat-hint>
  </mat-form-field>
  <app-validation-errors-display class="form-span" field="ip_address" [validationResult]="validationResult">
  </app-validation-errors-display>
  <div class="form-span editor-row">
    <mat-checkbox id="targetDisabled" [(ngModel)]="editItem.disabled"
      [disabled]="!editItem.allow_modify_self">禁用</mat-checkbox>
  </div>
  @if (!editItem.allow_modify_self) {
    <span class="form-span editor-note">内置访问目标的基本信息仅供查看。</span>
  }
  <div class="form-span editor-picklist">
    <label class="editor-label" for="target">节点分组</label>
    <app-dual-list id="target" [source]="editItem.peer_groups_lookup" [selected]="editItem.peer_groups"
      sourceHeader="可选" targetHeader="已选"
      [disabled]="!editItem.allow_modify_peer_groups"
      matTooltip="选中的节点分组可以访问此目标。" matTooltipPosition="above" matTooltipShowDelay="500">
      <ng-template #itemTemplate let-item>
        <div class="dual-list-item-content">
          <div class="dual-list-item-name">{{ item.name }}</div>
          <small>
            {{ item.description }}
          </small>
        </div>
      </ng-template>
    </app-dual-list>
  </div>
  <div class="form-span editor-actions">
    <button mat-flat-button color="primary" type="button" (click)="ok()" [disabled]="!hasChanges">
      <mat-icon>check</mat-icon>
      保存
    </button>
    <button mat-stroked-button type="button" (click)="cancel()">
      <mat-icon>close</mat-icon>
      取消
    </button>
    @if (editItem.id && editItem.allow_modify_self) {
      <button mat-flat-button color="warn" type="button" (click)="delete($event)">
        <mat-icon>block</mat-icon>
        删除
      </button>
    }
  </div>
  <div class="form-span editor-validation">
    <app-validation-errors-display [validationResult]="validationResult"></app-validation-errors-display>
  </div>
</div>
